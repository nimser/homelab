apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: rustfs
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4
          envFrom:
            - secretRef:
                name: rustfs-credentials
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: rustfs-data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: rustfs-data
          persistentVolumeClaim:
            claimName: rustfs-data-pvc
