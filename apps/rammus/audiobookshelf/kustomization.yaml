apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: audiobookshelf
resources:
  - ../../base/audiobookshelf/
  - cloudflare.yaml
  - ingress.yaml
  - tunnel-credentials.sops.yaml
# Audiobookshelf is stopped with its tunnel; PVCs are kept. Remove the patch to restart.
patches:
  - target: {kind: Deployment}
    patch: |
      - {op: replace, path: /spec/replicas, value: 0}
