# Recovery source for the Teable base backups and WAL mirrored from e2 every 5m.
# Barman writes to offsite-store; apps/karma/postgres-mirror owns the local copy.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: rustfs-store
spec:
  configuration:
    destinationPath: s3://cnpg-backups/teable-db
    endpointURL: http://rustfs-egress:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-s3-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-s3-credentials
        key: SECRET_ACCESS_KEY
