apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
data:
  config.yaml: |
    tunnel: 49e20eac-b7bd-45c6-9d24-ed4afb719aea
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    ingress:
      - hostname: tbl.example.com
        service: http://teable:3000
      # Attachment storage: browsers upload/download objects straight from the
      # storage endpoint, and the Teable backend signs URLs for that same
      # hostname, so it must resolve both publicly and from inside the cluster.
      # `rustfs.tn.example.com` is a CNAME to a MagicDNS name and resolves on the
      # tailnet only, hence the tunnel hostname here.
      # Only object/bucket paths of the two Teable buckets are forwarded, so
      # the RustFS admin and console endpoints stay off the public side.
      - hostname: s3.example.com
        path: ^/teable-(pub|pvt)(/|$)
        service: http://rustfs-egress:9000
        originRequest:
          # S3 SigV4 signs the Host header; keep the client's Host untouched.
          connectTimeout: 30s
      - hostname: s3.example.com
        service: http_status:404
      - service: http_status:404
