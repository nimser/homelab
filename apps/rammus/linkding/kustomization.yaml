apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linkding
resources:
  - ../../base/linkding/
  # - cloudflare.yaml
  - ingress.yaml
  - tunnel-credentials.sops.yaml
  - linkding-credentials.sops.yaml
# Linkding is stopped; its PVC is kept. Remove the patch to restart.
patches:
  - target: {kind: Deployment, name: linkding}
    patch: |
      - {op: replace, path: /spec/replicas, value: 0}
