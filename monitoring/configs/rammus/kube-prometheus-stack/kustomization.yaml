apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - grafana-credentials.sops.yaml
  - grafana-tls-cert-selfsign.sops.yaml

configMapGenerator:
  - name: grafana-homelab-overview
    files:
      - homelab-overview.json=dashboards/homelab-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
