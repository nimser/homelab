apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ../../base/kube-prometheus-stack/

patches:
  - path: release-patch-tls.yaml
    target:
      kind: HelmRelease
      name: kube-prometheus-stack
  - path: release-patch-dashboards.yaml
    target:
      kind: HelmRelease
      name: kube-prometheus-stack
