apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    grafana:
      ingress:
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt-production
        tls:
          - secretName: grafana-tailnet-tls
            hosts:
              - gfn.tn.example.com
