apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "78.2.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  valuesFrom:
    - kind: Secret
      name: grafana-credentials
      valuesKey: adminPassword
      targetPath: grafana.adminPassword
  values:
    # Memory limits keep both out of the Talos OOM controller's victim ranking, which only picks unlimited pods.
    prometheus:
      prometheusSpec:
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1Gi
    additionalPrometheusRulesMap:
      node-memory:
        groups:
          - name: node-memory
            rules:
              # Leaked containerd shims sit outside pod cgroups: node usage not attributed to pods (normally 1.2-1.8 GiB) grows.
              - alert: UnattributedNodeMemoryHigh
                expr: |
                  (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
                    - on() sum(container_memory_working_set_bytes{container!="", container!="POD", id=~"/kubepods.*"})
                    > 2.3 * 1024^3
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: Node memory outside pods exceeds 2.3 GiB; check for orphaned containerd-shim processes (docs/talos.md).
    grafana:
      resources:
        requests:
          memory: 192Mi
        limits:
          memory: 512Mi
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - gfn.tn.example.com
