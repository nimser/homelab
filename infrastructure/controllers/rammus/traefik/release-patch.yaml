apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  values:
    # Peaks near 170 MiB; a limit keeps it out of the Talos OOM controller's victim ranking.
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 384Mi
    providers:
      kubernetesIngress:
        publishedService:
          enabled: true
        # Allow Ingress backends pointing at ExternalName services: used by the
        # rustfs ingress (teable attachments) to reach RustFS on karma through
        # the tailscale egress service.
        allowExternalNameServices: true
    service:
      type: LoadBalancer
      annotations:
        tailscale.com/hostname: rammus-traefik
        tailscale.com/tags: tag:rammus
      spec:
        loadBalancerClass: tailscale
