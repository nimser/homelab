apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate
  namespace: infrastructure
spec:
  # Hourly 02:00-06:00 keeps its memory peak and automerged restarts out of daytime imports.
  schedule: "0 2-6 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          containers:
            - name: renovate
              image: renovate/renovate:latest
              # Peaks near 900 MiB; a limit keeps it out of the Talos OOM controller's victim ranking.
              resources:
                requests:
                  memory: 512Mi
                limits:
                  memory: 1280Mi
              env:
                - name: RENOVATE_CONFIG_FILE
                  value: "/opt/renovate/config.json"
              envFrom:
                - secretRef:
                    name: renovate-container-env
              volumeMounts:
                - name: config
                  mountPath: /opt/renovate/config.json
                  subPath: config.json
          volumes:
            - name: config
              configMap:
                name: renovate-configmap
          restartPolicy: Never
